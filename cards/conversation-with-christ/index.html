function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("")}
function open(rawHex){return crypto.subtle.importKey("raw",bytes(rawHex),"AES-GCM",false,["decrypt"]).then(function(k){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(IV)},k,Uint8Array.from(atob(DATA),function(c){return c.charCodeAt(0)}))
