function bytes(h){return new Uint8Array(h.match(/../g).map(function(x){return parseInt(x,16)}))}
function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("")}
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function unscramble(rawHex,iv,data){return crypto.subtle.importKey("raw",bytes(rawHex),"AES-GCM",false,["decrypt"]).then(function(k){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(iv)},k,b64(data))}).then(function(p){return new TextDecoder().decode(p)})}
function derive(pw,salt){return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]).then(function(k){
  return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:bytes(salt),iterations:600000},k,256)}).then(hex)}
// Tries each slot in turn. makeKey(slot) gives the key to try on it.
function openSlot(makeKey,i){i=i||0;if(i>=SLOTS.length)return Promise.reject(new Error("no slot"));var s=SLOTS[i],raw;
  return makeKey(s).then(function(r){raw=r;return unscramble(r,s.iv,s.data)}).then(function(t){var who=JSON.parse(t);who.raw=raw;return who},
    function(){return openSlot(makeKey,i+1)})}
function show(who){return unscramble(who.page,IV,DATA).then(function(html){
  var me=JSON.stringify({name:who.name,repo:who.notesRepo,key:who.notesKey}).replace(/</g,"\\u003c");
  html=html.replace("<!--gom-person-->",'<script id="gom-person">window.GOM_PERSON='+me+'<\/script>');
  document.open();document.write(html);document.close()})}
var f=document.getElementById("f"),m=document.getElementById("m"),saved=null;
try{saved=localStorage.getItem(KEY)}catch(e){}
function ask(){f.hidden=false;document.getElementById("p").focus()}
if(saved){openSlot(function(){return Promise.resolve(saved)}).then(show).catch(function(){try{localStorage.removeItem(KEY)}catch(e){}ask()})}else ask();
f.addEventListener("submit",function(e){e.preventDefault();m.textContent="";
  var pw=document.getElementById("p").value.trim().toLowerCase();
  openSlot(function(s){return derive(pw,s.salt)}).then(function(who){
    try{localStorage.setItem(KEY,who.raw)}catch(e){}return show(who)
  }).catch(function(){m.textContent="That password didn't work. Try again."})})
})();
