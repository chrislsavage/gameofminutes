function bytes(h){return new Uint8Array(h.match(/../g).map(function(x){return parseInt(x,16)}))}
function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("")}
function open(rawHex){return crypto.subtle.importKey("raw",bytes(rawHex),"AES-GCM",false,["decrypt"]).then(function(k){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(IV)},k,Uint8Array.from(atob(DATA),function(c){return c.charCodeAt(0)}))
}).then(function(p){return new TextDecoder().decode(p)})}
function show(html){document.open();document.write(html);document.close()}
function derive(pw){return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]).then(function(k){
  return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:bytes(SALT),iterations:600000},k,256)}).then(hex)}
var f=document.getElementById("f"),m=document.getElementById("m"),saved=null;
try{saved=localStorage.getItem(KEY)}catch(e){}
function ask(){f.hidden=false;document.getElementById("p").focus()}
if(saved){open(saved).then(show).catch(function(){try{localStorage.removeItem(KEY)}catch(e){}ask()})}else ask();
f.addEventListener("submit",function(e){e.preventDefault();m.textContent="";var raw;
  derive(document.getElementById("p").value.trim().toLowerCase()).then(function(r){raw=r;return open(r)}).then(function(html){
    try{localStorage.setItem(KEY,raw)}catch(e){}show(html)
  }).catch(function(){m.textContent="That password didn't work. Try again."})})
})();
</script></body></html>
